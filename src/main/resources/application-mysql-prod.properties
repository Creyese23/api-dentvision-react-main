spring.datasource.url=${MYSQL_PROD_URL}
spring.datasource.username=${MYSQL_PROD_USERNAME}
spring.datasource.password=${MYSQL_PROD_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Si da error al acceder a las tablas de la base de datos, pasar el valor update para que cree la estructura
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seed data se ejecuta siempre (INSERTs idempotentes con WHERE NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

logging.level.co.edu.sena.productsreact=INFO
logging.level.org.hibernate.SQL=WARN
